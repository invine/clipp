<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipp History — design preview</title><style>body{margin:0;background:#eae9ec;color:#222;font:14px system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid #d8d8dc;flex-wrap:wrap}header strong{font-size:15px}header span{color:#666}nav{display:flex;gap:5px;margin-left:auto}button{border:0;background:transparent;padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer;color:#444}button[aria-pressed=true]{background:#252329;color:white}.stage{padding:24px 12px;display:flex;justify-content:center}.frame{position:relative;overflow:hidden;box-shadow:0 8px 35px #0002;background:#111}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:#111}@media(max-width:600px){header{padding:12px}nav{margin-left:0}.stage{padding:12px}}</style></head><body><header><strong>History · design preview</strong><span>Interactive concept with sample data</span><nav aria-label="Preview size"><button data-size="phone" aria-pressed="true">Phone</button><button data-size="tablet" aria-pressed="false">Tablet</button><button data-size="desktop" aria-pressed="false">Desktop</button></nav></header><div class="stage"><div class="frame"><iframe src="screen.html" title="Clipp History interactive mockup"></iframe></div></div><script>
const sizes={phone:[390,800],tablet:[768,900],desktop:[1200,900]};let selected='phone';
function resize(){const [w,h]=sizes[selected], available=document.querySelector('.stage').clientWidth-24, scale=Math.min(1,available/w), frame=document.querySelector('.frame'),view=document.querySelector('iframe');frame.style.width=(w*scale)+'px';frame.style.height=(h*scale)+'px';view.style.width=w+'px';view.style.height=h+'px';view.style.transform='scale('+scale+')'}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{selected=b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b));resize()});window.addEventListener('resize',resize);resize();
</script></body></html>
