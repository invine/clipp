<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipp History</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><button class="brand icon-button" id="navButton" aria-label="Open navigation"><img src="clipp-icon.png" alt=""></button><label class="search"><svg><use href="#search"/></svg><input id="query" placeholder="Search history" aria-label="Search history"></label><button class="icon-button filter-toggle" id="filterToggle" aria-label="Toggle filters" aria-controls="filters" aria-expanded="true"><svg><use href="#sliders"/></svg></button><button class="connection icon-button" id="connectionButton" aria-label="Connection: connected"><svg viewBox="0 0 24 24"><use href="#network"/></svg></button></header>
<main aria-label="History"><div class="filters" id="filters"><div class="tabs" role="tablist" aria-label="Clip type"><button role="tab" aria-selected="true" data-filter="all">All</button><button role="tab" aria-selected="false" data-filter="pinned">Pinned</button><button role="tab" aria-selected="false" data-filter="links">Links</button></div><label class="source"><span>Source:</span><select id="source" aria-label="Filter by source"><option>All</option><option>Desktop</option><option>Pixel 9</option></select></label></div><section id="list" aria-label="Clipboard history"></section></main>
<div class="backdrop" id="backdrop" hidden></div><aside class="drawer" id="drawer" hidden><div class="drawer-brand"><img src="clipp-icon.png" alt=""><strong>clipp</strong><button class="icon-button" data-close aria-label="Close navigation">×</button></div><p>Workspace</p><button class="nav-active" data-close>History</button><button data-nav="Pinned">Pinned</button><button data-nav="Links">Links</button><button data-nav="Devices">Devices</button><button data-nav="Settings">Settings</button></aside>
<div class="popover" id="connectionPanel" hidden><strong><span class="dot"></span> <span id="statusLabel">Connected</span></strong><p id="statusDetail">Your devices can exchange clips.</p><button id="devicesButton">View devices →</button><div class="preview-state"><label for="stateSelect">Preview status</label><select id="stateSelect"><option value="direct">Direct connection</option><option value="relay">Relayed connection</option><option value="attention">Needs attention</option><option value="unknown">Unknown</option><option value="starting">Starting</option><option value="waiting">Relay ready</option><option value="idle">No trusted devices</option><option value="offline">Offline</option></select></div></div>
<dialog id="detail"><div id="detailContent"></div></dialog><div class="toast" id="toast" role="status"></div>
<svg xmlns="http://www.w3.org/2000/svg" class="sprite"><symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol><symbol id="pin" viewBox="0 0 24 24"><path d="M8 3h8l-1 5 3 3v2H6v-2l3-3-1-5ZM12 13v8"/></symbol><symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol><symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></symbol><symbol id="link" viewBox="0 0 24 24"><path d="m10 13 4-4M8.5 15.5l-1 1a4 4 0 0 1-5.5-5.8l4-4a4 4 0 0 1 5.7 0M15.5 8.5l1-1a4 4 0 0 1 5.5 5.8l-4 4a4 4 0 0 1-5.7 0"/></symbol><symbol id="network" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.3"/><circle cx="5" cy="18" r="2.3"/><circle cx="19" cy="18" r="2.3"/><path d="m10.9 6-4.8 9.8M13.1 6l4.8 9.8M7.4 18h9.2"/></symbol></svg><script src="app.js"></script></body></html>
