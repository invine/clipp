<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipp · Devices preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0b0d; color: #f4f3f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .preview-nav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; background: #222127; }
    .preview-nav a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 11px; border-radius: 6px; text-decoration: none; color: #d1ced9; font-size: 13px; }
    .preview-nav a[aria-current="page"] { background: #494453; color: #fff; }
    button, summary { font: inherit; cursor: pointer; }
    button:focus-visible, summary:focus-visible { outline: 2px solid #c8baff; outline-offset: 2px; }
    button { border: 0; color: inherit; }
    header { display: flex; align-items: center; gap: 20px; height: 64px; padding: 0 20px; border-bottom: 1px solid #303035; }
    header h1 { font-size: 19px; margin: 0; }
    .header-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .header-actions .button { min-height: 40px; padding: 0 14px; }
    .header-actions .icon-button { background: #29282f; }
    .hamburger { color: #b1afb8; font-size: 21px; }
    main { max-width: 690px; padding: 16px; margin: 0 auto; }
    .pair-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .button { min-height: 44px; padding: 0 16px; border-radius: 8px; background: #29282f; font-weight: 600; }
    .primary { color: #17151d; background: #ae9cf4; }
    .panel { padding: 16px; margin-bottom: 12px; border-radius: 9px; background: #151518; }
    h2 { font-size: 16px; margin: 0; }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .count, .id, .sub { font-size: 13px; color: #b1afb8; }
    .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; min-width: 0; }
    .local-row { padding: 0; }
    .row + .row { border-top: 1px solid #303035; }
    .row-body { min-width: 0; flex: 1; }
    .device-name { display: block; font-size: 15px; font-weight: 650; }
    .id { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 13px; color: #d0ced6; }
    .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .dot.offline { background: #777781; }
    .icon-button, .menu-trigger { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; background: transparent; border-radius: 8px; }
    .icon-button:hover, .menu-trigger:hover { background: #29282f; }
    .icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .local-actions { display: flex; align-items: center; }
    details { position: relative; flex: none; }
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .menu-trigger { font-size: 24px; line-height: 1; }
    .menu { position: absolute; top: 42px; right: 0; z-index: 2; min-width: 170px; padding: 5px; background: #333139; border-radius: 8px; box-shadow: 0 6px 20px #0009; }
    .menu button { width: 100%; padding: 11px; text-align: left; background: transparent; border-radius: 5px; }
    .menu button:hover { background: #4a4850; }
    dialog { max-width: min(440px, calc(100vw - 32px)); width: 100%; padding: 22px; border: 1px solid #414047; border-radius: 12px; background: #202026; color: #f4f3f6; }
    dialog::backdrop { background: #000a; }
    dialog h2 { margin-bottom: 12px; }
    dialog p { overflow-wrap: anywhere; line-height: 1.5; color: #d0ced6; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    #copy-error { font-size: 13px; color: #ffb7bd; }
    @media (max-width: 350px) { main { padding: 12px; } .panel { padding: 12px; } .button { padding: 0 12px; } }
  </style>
</head>
<body>
  <nav class="preview-nav" aria-label="Preview layouts"><a href="index.html" aria-current="page">Phone</a><a href="mac.html?size=full">Mac · full screen</a><a href="mac.html?size=half">Mac · half screen</a></nav>
  <header><span class="hamburger" aria-hidden="true">☰</span><h1>Devices</h1><div class="header-actions"><button class="button primary" type="button" data-preview="Pair this device">Pair</button><button class="icon-button" type="button" data-preview="Show my QR" aria-label="Show my QR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h6v6H3ZM15 3h6v6h-6ZM3 15h6v6H3ZM15 15h3v3h3v3h-6ZM21 12h-3M12 3v9H3M12 15v6"/></svg></button></div></header>
  <main>
    <section class="panel" aria-labelledby="local-heading">
      <div class="row local-row">
        <div class="row-body"><h2 id="local-heading">Samsung</h2><span class="id">12D3KooW...QXHiho</span></div>
        <div class="local-actions">
          <button class="icon-button" type="button" data-id="local" aria-label="Show and copy this device's peer ID"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="1.5"></rect><path d="M16 8V5H5v11h3"></path></svg></button>
          <button class="icon-button" type="button" data-preview="Rename this device" aria-label="Rename this device"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 12-12 4 4L8 20H4v-4ZM13 7l4 4"></path></svg></button>
        </div>
      </div>
    </section>
    <section class="panel" aria-labelledby="trusted-heading">
      <div class="panel-head"><h2 id="trusted-heading">Trusted devices</h2><span class="count">3 devices</span></div>
      <div class="row"><div class="row-body"><span class="device-name">Extension</span><span class="id">12D3KooWBon...HnWfv9hXMP</span><span class="status"><span class="dot"></span>Connected · direct</span></div><details><summary class="menu-trigger" aria-label="Extension actions">⋮</summary><div class="menu"><button type="button" data-id="extension">View peer ID</button><button type="button" data-preview="Edit Extension alias">Edit alias</button><button type="button" data-preview="Revoke Extension">Revoke device</button></div></details></div>
      <div class="row"><div class="row-body"><span class="device-name">Desktop</span><span class="id">12D3KooWNL4...nefUjBRWVc</span><span class="status"><span class="dot"></span>Connected · relay</span></div><details><summary class="menu-trigger" aria-label="Desktop actions">⋮</summary><div class="menu"><button type="button" data-id="desktop">View peer ID</button><button type="button" data-preview="Edit Desktop alias">Edit alias</button><button type="button" data-preview="Revoke Desktop">Revoke device</button></div></details></div>
      <div class="row"><div class="row-body"><span class="device-name">Tablet</span><span class="id">12D3KooWJ3d...7gK2sBRtD8</span><span class="status"><span class="dot offline"></span>Offline</span></div><details><summary class="menu-trigger" aria-label="Tablet actions">⋮</summary><div class="menu"><button type="button" data-id="tablet">View peer ID</button><button type="button" data-preview="Edit Tablet alias">Edit alias</button><button type="button" data-preview="Revoke Tablet">Revoke device</button></div></details></div>
    </section>
  </main>
  <dialog id="details-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><p id="copy-error" role="alert" hidden></p><div class="dialog-actions"><button class="button" id="close-dialog" type="button">Close</button><button class="button primary" id="copy-id" type="button">Copy peer ID</button></div></dialog>
  <script>
    const ids = {
      local: ['Samsung', '12D3KooWBdY7nb5eMZp94rKJJ4xwzTcsmaLQfmQXHiho'],
      extension: ['Extension', '12D3KooWBon4XJ2wzPea83TZcb96mGkqEHnWfv9hXMP'],
      desktop: ['Desktop', '12D3KooWNL4MdH9Z7gT2w4qJ5c3r8BXane fUjBRWVc'.replace(' ', '')],
      tablet: ['Tablet', '12D3KooWJ3d38Jthd8dQ52kA9BmK8e3f7gK2sBRtD8']
    };
    const dialog = document.getElementById('details-dialog');
    const title = document.getElementById('dialog-title');
    const copy = document.getElementById('dialog-copy');
    const copyButton = document.getElementById('copy-id');
    const copyError = document.getElementById('copy-error');
    let activeId = '';
    document.querySelectorAll('[data-id]').forEach(button => button.addEventListener('click', () => {
      const item = ids[button.dataset.id];
      activeId = item[1];
      copyError.hidden = true;
      title.textContent = item[0] + ' · Peer ID';
      copy.textContent = activeId;
      copyButton.hidden = false;
      button.closest('details')?.removeAttribute('open');
      dialog.showModal();
    }));
    document.querySelectorAll('[data-preview]').forEach(button => button.addEventListener('click', () => {
      title.textContent = button.dataset.preview;
      copyError.hidden = true;
      copy.textContent = 'This is a design preview. This action is not connected to a device.';
      copyButton.hidden = true;
      button.closest('details')?.removeAttribute('open');
      dialog.showModal();
    }));
    document.getElementById('close-dialog').addEventListener('click', () => dialog.close());
    copyButton.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(activeId); dialog.close(); }
      catch { copyError.textContent = 'Copy unavailable. Select the peer ID above to copy it.'; copyError.hidden = false; }
    });
  </script>
</body>
</html>
