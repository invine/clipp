<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipp History — design preview</title><style>body{margin:0;background:#eae9ec;color:#222;font:14px system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid #d8d8dc;flex-wrap:wrap}header strong{font-size:15px}header span{color:#666}nav{display:flex;gap:5px;margin-left:auto}button{border:0;background:transparent;padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer;color:#444}button[aria-pressed=true]{background:#252329;color:white}.stage{padding:24px;display:flex;justify-content:center}iframe{width:100%;max-width:1200px;height:calc(100vh - 120px);min-height:600px;border:0;background:#111;box-shadow:0 8px 35px #0002;transition:width .2s}iframe.phone{width:390px;height:800px}iframe.tablet{width:768px;height:900px}@media(max-width:600px){header{padding:12px}nav{margin-left:0}.stage{padding:0}iframe,iframe.phone,iframe.tablet{width:100%;height:calc(100vh - 115px);min-height:500px}}</style></head><body><header><strong>History · design preview</strong><span>Interactive concept with sample data</span><nav aria-label="Preview size"><button data-size="phone" aria-pressed="true">Phone</button><button data-size="tablet" aria-pressed="false">Tablet</button><button data-size="desktop" aria-pressed="false">Desktop</button></nav></header><div class="stage"><iframe class="phone" src="screen.html" title="Clipp History interactive mockup"></iframe></div><script>document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('iframe').className=b.dataset.size})</script></body></html>
