name: Verify Clipp

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: timeout 600s bash -euc 'apt-get update -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 && apt-get install -y --no-install-recommends build-essential python3 zip unzip'
      - run: npm ci
        env:
          # Routine CI does not run native Electron startup checks.
          SKIP_BIN: "1"
      - run: npm run verify
