apply plugin: 'com.android.application'


// Opt-in web-root overlay only: retain production MainActivity and every native adapter.
def runtimeResetAssets = null
if (project.hasProperty("clippRuntimeResetAssets") && !project.hasProperty("clippRuntimeResetAcceptance"))
    throw new GradleException("Owning reset assets require clippRuntimeResetAcceptance")
if (project.hasProperty("clippRuntimeResetAcceptance")) {
    if (!project.hasProperty("clippAcceptance") || project.hasProperty("clippIdentityResetAcceptance"))
        throw new GradleException("Owning reset requires normal isolated acceptance, excluding storage-only fixtures")
    if (!project.hasProperty("clippRuntimeResetAssets"))
        throw new GradleException("Reviewed fresh owning reset assets required")
    def supplied = new File(project.property("clippRuntimeResetAssets").toString())
    def repo = new File(rootProject.projectDir, "../../..").canonicalFile
    def parent = new File(repo, ".local")
    def assets = supplied.canonicalFile
    def owned = assets.parentFile
    if (!supplied.isAbsolute() || supplied.absoluteFile != assets || parent.absoluteFile != parent.canonicalFile ||
        !parent.isDirectory() || assets.name != "assets" || owned.parentFile != parent ||
        !(owned.name ==~ /reset-owning-acceptance-[A-Za-z0-9]+/) || !assets.isDirectory())
        throw new GradleException("Unsafe owning reset assets path")
    def receiptFile = new File(owned, "receipt.json")
    def manifestFile = new File(owned, "manifest.json")
    def indexFile = new File(assets, "public/index.html")
    for (def required : [receiptFile, manifestFile, indexFile]) {
        if (!required.isFile() || required.absoluteFile != required.canonicalFile)
            throw new GradleException("Complete fresh owning reset build receipt required")
    }
    def receipt = new groovy.json.JsonSlurper().parse(receiptFile)
    def sha = { file -> java.security.MessageDigest.getInstance("SHA-256").digest(file.bytes).encodeHex().toString() }
    if (receipt.version != 1 || receipt.kind != "clipp-runtime-reset-owning" ||
        receipt.applicationId != "com.clipp.app.acceptance" || receipt.assetDirectory != assets.path ||
        receipt.manifestSha256 != sha(manifestFile) || receipt.indexSha256 != sha(indexFile))
        throw new GradleException("Owning reset assets do not match their build receipt")
    runtimeResetAssets = assets
}

android {
    namespace "com.clipp.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.clipp.app"
        manifestPlaceholders = [relayCallbackScheme: "clipp-relay"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        // Explicitly opt in for native fixtures; never target the operator installation.
        if (project.hasProperty("clippAcceptance")) {
            acceptance {
                initWith debug
                applicationIdSuffix ".acceptance"
                matchingFallbacks = ["debug"]
                manifestPlaceholders = [relayCallbackScheme: "clipp-relay-acceptance"]
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testBuildType project.hasProperty("clippAcceptance") ? "acceptance" : "debug"
    if (project.hasProperty("clippIdentityResetAcceptance")) {
        if (!project.hasProperty("clippAcceptance")) throw new GradleException("Identity reset fixtures require clippAcceptance")
        sourceSets {
            acceptance {
                java.srcDir 'src/identityResetAcceptance/java'
                manifest.srcFile 'src/identityResetAcceptance/AndroidManifest.xml'
                assets.srcDir layout.buildDirectory.dir('generated/identityResetAcceptanceAssets')
            }
            androidTest.java.srcDir 'src/identityResetAcceptanceAndroidTest/java'
        }
    }
    sourceSets {
        androidTest.assets.srcDir layout.buildDirectory.dir('generated/androidTestAssets')
    }
    if (runtimeResetAssets != null) {
        sourceSets {
            acceptance.assets.srcDir runtimeResetAssets
        }
        // Final APK asset/root/class verification is still required by the native coordinator.
    }
    testOptions {
        managedDevices {
            devices {
                clippApi31(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 31
                    systemImageSource = "aosp"
                }
                clippApi33(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 33
                    systemImageSource = "aosp"
                }
                clippApi34(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 34
                    systemImageSource = "aosp"
                }
                clippApi35(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 35
                    systemImageSource = "aosp"
                }
                clippApi36(com.android.build.api.dsl.ManagedVirtualDevice) {
                    device = "Pixel 2"
                    apiLevel = 36
                    systemImageSource = "aosp"
                }
            }
            groups {
                backgroundContinuity {
                    targetDevices.add(devices.clippApi31)
                    targetDevices.add(devices.clippApi33)
                    targetDevices.add(devices.clippApi34)
                    targetDevices.add(devices.clippApi35)
                    targetDevices.add(devices.clippApi36)
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
